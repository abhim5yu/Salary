<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Salary</title>
<style>
:root{
  --bg:#F2F2F7;--surface:#FFFFFF;--text:#111111;--muted:#636366;--border:#E5E5EA;--hero:#E4F5EA;--lift:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  --accent:#087F42;--on-accent:#FFFFFF;--hatch:rgba(8,127,66,.16);--err:#C4161C;--shadow:0 8px 32px rgba(0,0,0,.14);
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
  --r-s:20px;--r-l:32px;
  box-sizing:border-box;padding-top:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px));padding-bottom:max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px));
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--hero:#1E1E1E;--lift:none;--bg:#121212;--surface:#1E1E1E;--text:#F5F5F5;--muted:#A0A0A0;--border:#2E2E2E;--accent:#4ADE80;--on-accent:#0A0A0A;--hatch:rgba(74,222,128,.12);--err:#FF6B63;--shadow:0 8px 32px rgba(0,0,0,.6)}}
:root[data-theme="dark"]{--hero:#1E1E1E;--lift:none;--bg:#121212;--surface:#1E1E1E;--text:#F5F5F5;--muted:#A0A0A0;--border:#2E2E2E;--accent:#4ADE80;--on-accent:#0A0A0A;--hatch:rgba(74,222,128,.12);--err:#FF6B63;--shadow:0 8px 32px rgba(0,0,0,.6)}
html{scroll-padding-top:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px))}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--text);font:400 16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;transition:background-color .3s,color .3s}
.app{max-width:480px;margin:0 auto;padding:var(--s5) 20px 140px}
.top{display:flex;align-items:center;justify-content:flex-end}
.mono{font:600 12px/1 ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:var(--s2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;flex:none}
.dot.live{animation:ring 2s ease-out infinite}
.ib{width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--text);display:grid;place-items:center;cursor:pointer;transition:background-color .3s,border-color .3s}
.ib svg{transition:transform .3s}.ib:active svg{transform:rotate(40deg) scale(.9)}
.card{box-shadow:var(--lift);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-l);padding:var(--s5);transition:background-color .3s,border-color .3s}
.hero{background:var(--hero);position:relative;overflow:hidden;margin-top:var(--s5);padding:var(--s6) var(--s5);min-height:300px;display:flex;flex-direction:column;justify-content:center}
.hero::before{content:"";position:absolute;inset:0 -20px;background:repeating-linear-gradient(45deg,var(--hatch) 0 2px,transparent 2px 10px);animation:slide 1.4s linear infinite;pointer-events:none}
.hero>*{position:relative}
@keyframes slide{to{transform:translateX(14.142px)}}
.total{display:flex;align-items:baseline;gap:var(--s2);margin:var(--s4) 0 var(--s3);color:var(--accent);font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.cur{font-size:clamp(32px,10vw,52px)}
#total{font-size:clamp(64px,22vw,112px);line-height:1;display:inline-block;white-space:nowrap;animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-3px)}}
.sub{font-size:14px;color:var(--muted)}
.streak{margin-top:var(--s3)}
.srow{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--s4)}

.months{display:flex;justify-content:space-between}
.mo{display:grid;gap:var(--s2);justify-items:center;font-size:12px;color:var(--muted)}
.c{width:40px;height:40px;border-radius:50%;border:2px solid var(--border);display:grid;place-items:center;color:var(--on-accent)}
.ok{color:var(--text)}
.ok .c{background:var(--accent);border-color:var(--accent);animation:pop .5s calc(var(--i)*.08s) cubic-bezier(.3,1.5,.5,1) both}
.ok path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .4s calc(.2s + var(--i)*.08s) forwards}
.now:not(.ok) .c{border-color:var(--accent);animation:ring 2s ease-out infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
@keyframes ring{0%{box-shadow:0 0 0 0 var(--hatch)}100%{box-shadow:0 0 0 12px transparent}}
.hd{margin-top:var(--s6)}
.hrow{display:flex;align-items:center;justify-content:space-between}
.seg{display:flex;gap:var(--s1);padding:var(--s1);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-l);transition:background-color .3s,border-color .3s}
.seg button{width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:background-color .2s,color .2s,transform .15s}
.seg button:active{transform:scale(.92)}
.seg button[aria-pressed=true]{background:var(--text);color:var(--bg)}
.sh{display:none}
.row{box-shadow:var(--lift)}
ul.compact{gap:var(--s1)}
ul.compact .row{min-height:44px;padding:var(--s2) var(--s4)}
ul.compact .m small{display:none}
ul.compact .row b{font-size:16px}
ul.pill{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}
ul.pill .row{width:100%;justify-content:space-between;min-height:44px;padding:var(--s2) var(--s4);border-radius:var(--r-l);gap:var(--s2)}
ul.pill .m{flex:none;flex-direction:row}
ul.pill .m small,ul.pill .lg{display:none}
ul.pill .sh{display:inline}
ul.pill .row b{font-size:16px}
.msg{font-size:14px;color:var(--muted);padding:var(--s3) var(--s4);background:var(--bg);border-radius:var(--r-s);white-space:pre-wrap;word-break:break-word}
.row .msg,.row .th{display:none}
ul.card{gap:var(--s3)}
ul.card .row{flex-wrap:wrap;padding:var(--s4);border-radius:var(--r-l);gap:var(--s3)}
ul.card .row>.dot{display:none}
ul.card .row b{font-size:24px;color:var(--accent)}
ul.card .row .msg{display:block;flex:1 0 100%}
ul.card .row .th{display:block;flex:1 0 100%;width:100%;max-height:180px;object-fit:cover;border-radius:var(--r-s);border:1px solid var(--border)}
textarea{width:100%;padding:var(--s3) var(--s4);background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:var(--r-s);font:400 16px system-ui,sans-serif;resize:vertical}
ul{list-style:none;padding:0;display:grid;gap:var(--s2);margin-top:var(--s4)}
li.in{animation:rise .5s calc(var(--i)*70ms) both}
li.pop{animation:pop .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.row{width:100%;display:flex;align-items:center;gap:var(--s3);min-height:64px;padding:var(--s3) var(--s4);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-s);color:inherit;font:inherit;text-align:left;cursor:pointer;transition:transform .15s,border-color .2s,background-color .3s}
.row:hover{border-color:var(--muted)}
.row:active{transform:scale(.97)}
.m{flex:1;display:flex;flex-direction:column;font-weight:600}
.m small{font-weight:400;font-size:12px;color:var(--muted)}
.row b{font-weight:600;font-size:20px;font-variant-numeric:tabular-nums}

.empty{margin-top:var(--s5);padding:var(--s6) var(--s4);text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:var(--r-s)}
.note{margin-top:var(--s5);font-size:12px;color:var(--muted)}
.bar{position:fixed;left:0;right:0;bottom:0;padding:var(--s4) 20px calc(var(--s4) + max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px)));background:var(--bg);border-top:1px solid var(--border);transition:background-color .3s}
.bar .btn{max-width:440px;margin:0 auto}
.btn{display:block;width:100%;min-height:52px;border:1px solid transparent;border-radius:var(--r-l);background:var(--text);color:var(--bg);font:600 16px system-ui,sans-serif;cursor:pointer;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--border)}
.btn.danger{background:transparent;color:var(--err);border-color:var(--err)}
button:focus-visible,input:focus-visible,textarea:focus-visible,.attach:focus-within{outline:2px solid var(--text);outline-offset:2px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:480px;max-height:92vh;overflow:auto;display:grid;gap:var(--s4);padding:var(--s5) 20px calc(var(--s5) + max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px)));background:var(--surface);border-radius:var(--r-l) var(--r-l) 0 0;box-shadow:var(--shadow)}
.sheet:not([hidden]){animation:up .3s cubic-bezier(.2,1,.3,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
h2{font:600 20px/1.2 system-ui,sans-serif}
.field{display:grid;gap:var(--s2)}
input[type=number],input[type=date]{width:100%;min-height:52px;padding:0 var(--s4);background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:var(--r-s);font:400 16px system-ui,sans-serif}
#amt{font-size:24px;font-weight:600}
.attach{position:relative;display:flex;align-items:center;justify-content:center;gap:var(--s2);min-height:52px;border:1px dashed var(--muted);border-radius:var(--r-s);color:var(--muted);font-size:14px;cursor:pointer}
.attach:hover{color:var(--text);border-color:var(--text)}
.attach input{position:absolute;opacity:0;width:1px;height:1px}
.shot{width:100%;max-height:260px;object-fit:contain;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-s)}
.big{font-size:40px;line-height:1;font-weight:800;color:var(--accent)}
.btns{display:grid;gap:var(--s2)}
@media (prefers-reduced-motion:reduce){.hero::before,#total,.dot.live,.now .c{animation:none!important}}
</style>
</head>
<body>
<main class="app">
  <header class="top">
    
    <button class="ib" id="theme" aria-label="Switch light or dark mode"></button>
  </header>
  <section class="card hero">
    <p class="mono">Total received</p>
    <div class="total"><span class="cur">₹</span><span id="total">0</span></div>
    
  </section>
  <section class="card streak">
    <div class="srow"><p class="mono">Streak</p></div>
    <div class="months" id="months"></div>
  </section>
  <div class="hd hrow"><p class="mono">History</p><div class="seg" id="seg" role="group" aria-label="History view"><button data-v="compact" aria-label="Compact view" aria-pressed="false"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><button data-v="full" aria-label="Full view" aria-pressed="false"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="7" rx="3"/><rect x="4" y="13" width="16" height="7" rx="3"/></svg></button><button data-v="pill" aria-label="Pill view" aria-pressed="false"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="10" height="6" rx="3"/><rect x="15" y="4" width="6" height="6" rx="3"/><rect x="3" y="14" width="6" height="6" rx="3"/><rect x="11" y="14" width="10" height="6" rx="3"/></svg></button><button data-v="card" aria-label="Card view" aria-pressed="false"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="3" width="16" height="18" rx="4"/><path d="M8 9h8M8 13h5"/></svg></button></div></div>
  <ul id="list"></ul>
  <p class="empty" id="empty" hidden>No salary added yet.<br>Tap “Add salary” to start.</p>
  
</main>

<div class="bar"><button class="btn" id="add">Add salary</button></div>
<div class="scrim" id="scrim" hidden></div>

<section class="sheet" id="addSheet" role="dialog" aria-label="Add salary" hidden>
  <h2>Add salary</h2>
  <div class="field"><label class="mono" for="amt">Amount (₹)</label><input id="amt" type="number" inputmode="decimal" min="0" placeholder="0"></div>
  
  <div class="field">
    <span class="mono">Screenshot</span>
    <img class="shot" id="pv" alt="Screenshot preview" hidden>
    <label class="attach"><input id="file" type="file" accept="image/*"><span id="attachTxt">Attach screenshot</span></label>
  </div>
  <button class="btn ghost" id="read" hidden>Read text from screenshot</button>
  <p class="sub" id="rnote" hidden></p>
  <div class="field"><label class="mono" for="msg">Message text</label><textarea id="msg" rows="3" placeholder="Paste the salary message. Amount and date fill in automatically."></textarea></div>
  <p class="sub" id="dnote" hidden></p>
  <div class="btns"><button class="btn" id="save" disabled>Save</button><button class="btn ghost" data-close>Cancel</button></div>
</section>

<section class="sheet" id="viewSheet" role="dialog" aria-label="Salary details" hidden>
  <p class="mono" id="vMonth"></p>
  <div class="total" style="margin:0"><span class="cur" style="font-size:24px">₹</span><span class="big" id="vAmt"></span></div>
  <p class="sub" id="vDate"></p>
  <p class="msg" id="vMsg" hidden></p>
  <img class="shot" id="vImg" alt="Salary screenshot" hidden>
  <p class="sub" id="vNone" hidden>No screenshot attached.</p>
  <div class="btns"><button class="btn danger" id="del">Delete</button><button class="btn ghost" data-close>Close</button></div>
</section>

<script>
const $=id=>document.getElementById(id);
const fmt=n=>n.toLocaleString('en-IN',{maximumFractionDigits:2});
const D=d=>new Date(d+'T00:00');
const mon=d=>D(d).toLocaleDateString('en-IN',{month:'long',year:'numeric'});
const day=d=>D(d).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
const mons=d=>D(d).toLocaleDateString('en-IN',{month:'short',year:'2-digit'});
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MN={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
function parse(t){
  const o={},a=t.match(/(?:\brs\.?|\binr|₹)\s*([\d,]+(?:\.\d+)?)/i);
  if(a){const n=parseFloat(a[1].replace(/,/g,''));if(n>0)o.amt=n}
  let dd,mm,yy,d=t.match(/\b(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})\b/);
  if(d){dd=+d[1];mm=+d[2];yy=+d[3]}
  else{d=t.match(/\b(\d{1,2})[\s-]([a-z]{3})[a-z]*[\s,-]*(\d{2,4})\b/i);if(d&&MN[d[2].toLowerCase()]){dd=+d[1];mm=MN[d[2].toLowerCase()];yy=+d[3]}}
  if(dd&&dd<32&&mm&&mm<13){if(yy<100)yy+=2000;o.date=yy+'-'+String(mm).padStart(2,'0')+'-'+String(dd).padStart(2,'0')}
  return o;
}
const mk=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
const shrink=src=>new Promise(res=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.85))};im.onerror=()=>res(src);im.src=src});
const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open('salary',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
async function load(){try{const d=await idb();return await new Promise(ok=>{const q=d.transaction('kv').objectStore('kv').get('items');q.onsuccess=()=>ok(q.result||[]);q.onerror=()=>ok([])})}catch(e){console.error(e);return[]}}
async function persist(){try{const d=await idb();d.transaction('kv','readwrite').objectStore('kv').put(items,'items')}catch(e){console.error(e)}}
const TICK='<svg viewBox="0 0 24 24" width="22" height="22"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
let items=[], pending=null, openId=null, armed=false, nextId=4, first=true, shown=0;

function fit(){const t=$('total'),b=t.parentElement;t.style.fontSize='';let f=parseFloat(getComputedStyle(t).fontSize);while(b.scrollWidth>b.clientWidth&&f>24){f-=2;t.style.fontSize=f+'px'}}
function count(to){
  const from=shown,t0=performance.now();shown=to;$('total').textContent=fmt(to);fit();
  (function f(t){const p=Math.min((t-t0)/700,1),e=1-Math.pow(1-p,3);
    $('total').textContent=fmt(Math.round((from+(to-from)*e)*100)/100);
    if(p<1)requestAnimationFrame(f)})(t0);
}
function streak(){
  const has=new Set(items.map(i=>i.date.slice(0,7))),n=new Date();
  $('months').innerHTML=[5,4,3,2,1,0].map((k,i)=>{
    const d=new Date(n.getFullYear(),n.getMonth()-k,1),ok=has.has(mk(d));
    return '<div class="mo'+(ok?' ok':'')+(k===0?' now':'')+'" style="--i:'+i+'"><span class="c">'+(ok?TICK:'')+'</span>'+d.toLocaleDateString('en-IN',{month:'short'})+'</div>';
  }).join('');
}
function render(newId){
  items.sort((a,b)=>b.date.localeCompare(a.date));
  count(items.reduce((s,i)=>s+i.amt,0));
  
  $('empty').hidden=items.length>0;
  $('list').innerHTML=items.map((i,k)=>'<li style="--i:'+k+'"'+(first?' class="in"':i.id===newId?' class="pop"':'')+'><button class="row" data-id="'+i.id+'"><span class="m"><span class="lg">'+mon(i.date)+'</span><span class="sh">'+mons(i.date)+'</span><small>'+day(i.date)+'</small></span>'+(i.img?'<i class="dot"></i>':'')+'<b>₹'+fmt(i.amt)+'</b>'+(i.msg?'<span class="msg">'+esc(i.msg)+'</span>':'')+(i.img?'<img class="th" src="'+i.img+'" alt="">':'')+'</button></li>').join('');
  streak();first=false;
}
function show(el){$('scrim').hidden=false;el.hidden=false}
function hide(){['scrim','addSheet','viewSheet'].forEach(id=>$(id).hidden=true)}

document.addEventListener('click',e=>{if(e.target.closest('button,.attach'))buzz(8)},true);
$('add').onclick=()=>{
  pending=null;$('amt').value='';$('file').value='';$('pv').hidden=true;$('attachTxt').textContent='Attach screenshot';$('msg').value='';$('read').hidden=true;$('rnote').hidden=true;
  dt='';note();$('save').disabled=true;show($('addSheet'));$('amt').focus();
};
$('amt').oninput=()=>{$('save').disabled=!(parseFloat($('amt').value)>0)};
let dt='';
const today=()=>{const n=new Date();return mk(n)+'-'+String(n.getDate()).padStart(2,'0')};
function note(){const m=$('dnote');m.hidden=!$('msg').value.trim();m.textContent=dt?'Date found in message: '+day(dt):'No date in message. Today’s date will be used.'}
function fill(t){const p=parse(t);if(p.amt)$('amt').value=p.amt;dt=p.date||'';note();$('save').disabled=!(parseFloat($('amt').value)>0)}
$('msg').oninput=e=>fill(e.target.value);
$('read').onclick=async()=>{
  const n=$('rnote');n.hidden=false;
  if(!window.appOCR){n.textContent='Reading screenshots works in the installed app. In this preview, paste the message text instead.';return}
  n.textContent='Reading…';
  try{const t=await window.appOCR(pending);$('msg').value=t;fill(t);n.textContent='Done. Please check the amount and date.'}
  catch(e){n.textContent='Couldn’t read that image. Paste the text instead.'}
};
$('file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=async()=>{pending=await shrink(r.result);$('pv').src=pending;$('pv').hidden=false;$('attachTxt').textContent='Change screenshot';$('read').hidden=false;if(window.appOCR)$('read').click()};
  r.readAsDataURL(f);
};
$('save').onclick=()=>{
  const amt=parseFloat($('amt').value);if(!(amt>0))return;
  const id=nextId++;items.push({id,amt,date:dt||today(),img:pending||undefined,msg:$('msg').value.trim()||undefined});
  hide();render(id);persist();buzz([20,50,20]);
};
$('list').onclick=e=>{
  const b=e.target.closest('.row');if(!b)return;
  const i=items.find(x=>x.id==b.dataset.id);openId=i.id;armed=false;$('del').textContent='Delete';
  $('vMonth').textContent=mon(i.date);$('vAmt').textContent=fmt(i.amt);$('vDate').textContent='Received '+day(i.date);
  $('vMsg').hidden=!i.msg;$('vMsg').textContent=i.msg||'';$('vImg').hidden=!i.img;$('vNone').hidden=!!i.img;if(i.img)$('vImg').src=i.img;
  show($('viewSheet'));
};
$('del').onclick=()=>{
  if(!armed){armed=true;$('del').textContent='Tap again to delete';buzz(20);return}
  items=items.filter(x=>x.id!==openId);hide();render();persist();buzz([40,30,40]);
};
$('scrim').onclick=hide;
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=hide);

const root=document.documentElement;
const isDark=()=>(root.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))==='dark';
const IC='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">';
const SUN=IC+'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON=IC+'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
const icon=()=>{$('theme').innerHTML=isDark()?SUN:MOON};
try{const t=localStorage.getItem('theme');if(t)root.dataset.theme=t}catch(e){}
$('theme').onclick=()=>{const t=isDark()?'light':'dark';root.dataset.theme=t;try{localStorage.setItem('theme',t)}catch(e){}icon()};
let view='full';
try{view=localStorage.getItem('hist')||'full'}catch(e){}
if(!['compact','full','pill','card'].includes(view))view='full';
function setView(v){
  view=v;$('list').className=v;
  document.querySelectorAll('#seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v));
  $('list').querySelectorAll('li').forEach(li=>{li.classList.remove('in','pop');void li.offsetWidth;li.classList.add('in')});
  try{localStorage.setItem('hist',v)}catch(e){}
}
$('seg').onclick=e=>{const b=e.target.closest('button');if(b)setView(b.dataset.v)};
icon();setView(view);addEventListener('resize',()=>{$('total').textContent=fmt(shown);fit()});
load().then(a=>{items=a;nextId=Math.max(0,...a.map(i=>i.id))+1;render()});
(function(){
  const C=window.Capacitor;if(!C||!C.isNativePlatform||!C.isNativePlatform())return;
  const FS=C.registerPlugin('Filesystem'),TR=C.registerPlugin('TextRecognition');
  window.appOCR=async src=>{
    const w=await FS.writeFile({path:'ocr-'+Date.now()+'.jpg',data:src.split(',')[1],directory:'CACHE'});
    const r=await TR.processImage({path:w.uri,script:'LATIN'});
    return r.text||'';
  };
})();
</script>
</body>
